<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bible Advisor</title>
  <meta name="description" content="Tell God how you feel and find Bible verses that speak to it. Every answer leads to Jesus. Free, offline, no account, no tracking.">
  <meta name="theme-color" content="#1B2A3A">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/eb-garamond-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { var t = localStorage.getItem('ba-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div id="splash" class="splash" aria-hidden="true">
    <img src="icons/logo.svg" alt="" width="96" height="96">
    <h1>Bible Advisor</h1>
    <p>Every answer leads to Jesus.</p>
  </div>

  <main id="main" tabindex="-1" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/home" data-tab="home"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
    <a href="#/feelings" data-tab="feelings"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span>Feelings</span></a>
    <a href="#/ask" data-tab="ask"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M10 9.2a2 2 0 1 1 2.6 1.9c-.4.2-.6.5-.6.9v.4M12 14.2v.1"/></svg><span>Ask</span></a>
    <a href="#/bible" data-tab="bible"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M12 7v5M10 9h4"/></svg><span>Bible</span></a>
    <a href="#/saved" data-tab="saved"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span>Saved</span></a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">Bible Advisor needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
